<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>FinTrack</title>
  <!-- Rounded square background -->
  <rect width="96" height="96" rx="20" fill="#5b6ef5"/>
  <!-- Shield fill (subtle inner glow) -->
  <path d="M 48 20 L 70 34 L 70 58 Q 70 76 48 84 Q 26 76 26 58 L 26 34 Z" fill="white" opacity="0.08"/>
  <!-- Shield outline -->
  <path d="M 48 20 L 70 34 L 70 58 Q 70 76 48 84 Q 26 76 26 58 L 26 34 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.22"/>
  <!-- Trend line -->
  <polyline points="31,62 41,45 51,53 65,32" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peak dot -->
  <circle cx="65" cy="32" r="4.5" fill="white"/>
</svg>
